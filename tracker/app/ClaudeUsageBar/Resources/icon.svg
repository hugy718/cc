<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC9A75"/>
      <stop offset="1" stop-color="#C55D39"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background (softer corners) -->
  <rect x="0" y="0" width="100" height="100" rx="27" fill="url(#coral)"/>
  <rect x="0" y="0" width="100" height="100" rx="27" fill="url(#gloss)"/>

  <!-- usage gauge: faint full track + ~72% arc -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6.5"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#ffffff" stroke-width="6.5"
          stroke-linecap="round" stroke-dasharray="149 207" transform="rotate(-90 50 50)"/>

  <!-- sunburst spark: 12 rounded rays radiating from centre, alternating long/short -->
  <g stroke="#ffffff" stroke-width="3.4" stroke-linecap="round">
    <!-- long rays -->
    <line x1="50" y1="48.5" x2="50" y2="30"/>
    <line x1="50" y1="48.5" x2="50" y2="30" transform="rotate(60 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="30" transform="rotate(120 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="30" transform="rotate(180 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="30" transform="rotate(240 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="30" transform="rotate(300 50 50)"/>
    <!-- short rays -->
    <line x1="50" y1="48.5" x2="50" y2="38" transform="rotate(30 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="38" transform="rotate(90 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="38" transform="rotate(150 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="38" transform="rotate(210 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="38" transform="rotate(270 50 50)"/>
    <line x1="50" y1="48.5" x2="50" y2="38" transform="rotate(330 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
</svg>
