<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC9A75"/>
      <stop offset="1" stop-color="#C55D39"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#coral)"/>
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#gloss)"/>

  <!-- usage gauge: faint full track + ~72% arc -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="7"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="149 207" transform="rotate(-90 50 50)"/>

  <!-- Claude spark, centered -->
  <path d="M50 31 C51.5 44, 56 48.5, 69 50 C56 51.5, 51.5 56, 50 69 C48.5 56, 44 51.5, 31 50 C44 48.5, 48.5 44, 50 31 Z"
        fill="#ffffff"/>
</svg>
